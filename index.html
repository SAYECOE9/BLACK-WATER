<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK WATER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="stylec.css">
</head>

<body>
    <main class="relative h-screen w-screen overflow-hidden">
        <!-- css style color -->

        <div class="background"></div>
        <div class="atmospheric-overlay"></div>
        <div class="center-light"></div>
        <div class="drak-edges"></div>

        <header class="absolute top-5 left-1/2 z-30 w-[92%] max-w-5xl -translate-x-1/2">
            <nav
                class="glass-nav flex items-center justify-between rounded-full px-5 py-3 shadow-[0_10px_40px_rgba(0,0,0,.15)]">
                <a href="#" class="text-bg font-bold tracking-[5px] text-white">BW</a>

                <div class="hidden items-center gap-10 md:flex">
                    <a href="#"
                        class="text-[1rem] font-bold tracking-[2px] text-white/90 transition duration-300 hover:text-cyan-200">HOME</a>
                    <a href="#"
                        class="text-[1rem] font-bold tracking-[2px] text-white/90 transition duration-300 hover:text-cyan-200">ABOUT</a>
                    <a href="#"
                        class="text-[1rem] font-bold tracking-[2px] text-white/90 transition duration-300 hover:text-cyan-200">SEARCH</a>

                </div>
                <div class="flex items-center gap-1">
                    <a href="#"
                        class="rounded-full border border-cyan-200 bg-cyan-300/80 px-4 py-1.5 text-[1rem] font-bold tracking-[1px text-white shadow-[0_0_20px_rgba(76,210,240,.25)]] transition hover:bg-cyan-200">
                        SIGN UP
                    </a>

                    <a href="#"
                        class="rounded-full border border-white bg-white/10 px-4 py-1.5 text-[1rem] font-bold tracking-[1px] text-white backdrop-blur-md transition hover:bg-cyan-200">
                        LOG IN
                    </a>
                </div>
            </nav>
        </header>
        <aside class="absolute top-1/2 left-5 z-20 hidden  -translate-y-1/2 sm:block md:left-10">


            <div class="social-line  flex flex-col items-center">

                <a href="#"
                    class="mb-20 rotate-[90deg] text-[10px] font-bold tracking-[2px] text-white/85 duration-300 hover:text-cyan-200">
                    TWITTER
                </a>

                <a href="#"
                    class="mb-20 rotate-[90deg] text-[10px] font-bold tracking-[3px] text-white/85 duration-300 hover:text-cyan-200">
                    INSTAGRAM
                </a>

                <a href="#"
                    class="rotate-[90deg] text-[10px] font-bold tracking-[3px] text-white/85 duration-300 hover:text-cyan-200">
                    FACEBOOK
                </a>

            </div>




        </aside>
        <section class="absolute inset-0 z-10 flex items-center justify-center">
            <div class="overflow-hidden flex flex-col items-center text-center">

                <div
                    class="mb-3 hidden items-center gap-3 text-[10px] font-medium tracking-[5px] text-white/100 md:flex">
                    <span class="h-px w-8 bg-white/50"></span>

                    DEEP BLUE EXPERIENCE

                    <span class="h-px w-8 bg-white/50"></span>
                </div>
                <h1
                    class="title-shine text-[65px] leading-[.78] font-black tracking-[5px] select-none sm:text-[90px] md:text-[135px] lg:text-[165px]">
                    BLACK
                </h1>
                <h2
                    class="water-text -mt-1 text-[25px] leading-none tracking-[16px] select-none sm:text-[43px] md:tracking-[22px]">
                    WATER
                </h2>
                <p class="mt-6 max-w-xs text-[9px] leading-5 font-light tracking-[1px] text-white/70 sm:max-w-sm">
                    WHERE THE SURFACE ENDS <br> AND THE UNKNOWN BEGINS
                </p>

                <a href="#" class="group mt-8 flex flex-col items-center">
                    <span
                        class="flex h-10 min-w-[100px] items-center justify-center rounded-full border border-white/45 bg-white/10 px-5 text-[12px] font-bold tracking-[3px] text-white backdrop-blur-md transition duration-500 group-hover:border-cyan-200 group-hover:bg-cyan-200/20 group-hover:shadow-[0_0_25px_rgba(82,210,240,.35)]">
                        EXPLORE </span>

                    <span class="mt-2 text-[14px] text-white/80 transition duration-300 group-hover:translate-y-1"> ?
                    </span>
                </a>

            </div>

        </section>
        <div
            class="absolute bottom-6 hidden left-1/2 z-20 flex -translate-x-1/2 items-center gap-5 text-[7px] tracking-[2px] text-white/55 md:flex">
            <span>OCEAN</span>
            <span class="h-1 w-1 rounded-full bg-cyan-200"></span>
            <span>DISCOVER</span>
            <span class="h-1 w-1 rounded-full bg-cyan-200"></span>
            <span>BEYOND</span>
        </div>
    </main>
</body>

</html>
